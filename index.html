cust(){
  const m={};
  S.s.forEach(s=>{const k=(s.ph||s.cust||'অজানা').trim();(m[k]=m[k]||{n:s.cust,ph:s.ph,l:[]}).l.push(s)});
  const list=CUL=Object.values(m).sort((a,b)=>b.l.reduce((x,s)=>x+tot(s),0)-a.l.reduce((x,s)=>x+tot(s),0));

acc(){
  const L=[];
  S.s.forEach(s=>s.paid>0&&L.push({d:s.date,t:`বিক্রি #${s.no}: ${s.name} (${s.cust})`,i:s.paid,x:0}));
  S.pu.forEach(b=>L.push({d:b.date,t:`ক্রয়: ${b.name} × ${b.qty}`,i:0,x:b.paid==null?b.qty*b.cost:b.paid}));S.cp.forEach(c=>L.push({d:c.date,t:'কোম্পানিকে পেমেন্ট: '+((S.co.find(o=>o.id===c.co)||{}).name||''),i:0,x:c.amt}));S.sv.forEach(v=>{if(v.paid>0)L.push({d:v.date,t:'সার্ভিস S-'+v.no+': '+v.cust,i:v.paid,x:0});if(v.parts>0)L.push({d:v.date,t:'সার্ভিসের পার্টস S-'+v.no,i:0,x:v.parts})});
  S.e.forEach(e=>L.push({d:e.date,t:e.title,i:0,x:e.amt,id:e.id}));
  L.sort((a,b)=>b.d.localeCompare(a.d));
  const I=L.reduce((a,l)=>a+l.i,0),X=L.reduce((a,l)=>a+l.x,0);
  return `<div class="grid"><div class="st"><small>মোট আয় (নগদ পাওয়া)</small><b class="ok">${fm(I)}</b></div><div class="st"><small>মোট ব্যয়</small><b class="bad">${fm(X)}</b></div><div class="st"><small>ক্যাশ ব্যালেন্স</small><b>${fm(I-X)}</b></div></div>

function bh(){const p=findP($('#bnm').value);$('#bhint').textContent=p?`এই নাম আছে — বর্তমান স্টক ${p.qty} পিস, এন্ট্রি দিলে স্টক বাড়বে`:'';if(p&&!$('#bp').value)$('#bp').value=p.price||''}
function addBuy(e){e.preventDefault();
  const name=$('#bnm').value.trim(),qty=num($('#bq').value),cost=num($('#bc').value),price=$('#bp').value;
  let p=findP(name);
  if(!p){p={id:uid(),name,qty:0,cost:0,price:0};S.p.push(p)}
  p.cost=(p.qty*p.cost+qty*cost)/(p.qty+qty);p.qty+=qty;if(price!=='')p.price=num(price);
  S.pu.push({id:uid(),date:$('#bd').value||today(),sup:$('#bs').value.trim(),pid:p.id,name:p.name,qty,cost,paid:$('#bpd').value===''?qty*cost:num($('#bpd').value)});
  save();R()}
function delBuy(id){const b=S.pu.find(x=>x.id===id);if(!b||!confirm('এই ক্রয় মুছবেন? স্টক থেকে '+b.qty+' পিস কমবে।'))return;
  const p=S.p.find(x=>x.id===b.pid);if(p)p.qty=Math.max(0,p.qty-b.qty);S.pu=S.pu.filter(x=>x.id!==id);save();R()}
function rows(){const q=($('#sq')?$('#sq').value:'').toLowerCase();
  $('#tb').innerHTML=S.p.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p.name)}</td><td class="n ${p.qty<=2?'bad':''}"><b>${p.qty}</b></td><td class="n">${fm(p.cost)}</td><td class="n">${fm(p.price)}</td><td class="n">${fm(p.qty*p.cost)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">কোনো পণ্য নেই।</td></tr>'}
function sf(){const p=S.p.find(x=>x.id===$('#sp').value);$('#spr').value=p?p.price:'';slt()}
function slt(){const e=$('#slt');if(!e)return;const q=num($('#sqty').value),pr=num($('#spr').value);e.textContent=$('#sp').value&&q&&pr?'এই পণ্যের মোট: '+fm(q*pr):''}
function addCart(){const p=S.p.find(x=>x.id===$('#sp').value),qty=num($('#sqty').value);
  if(!p||qty<1)return alert('পণ্য ও পিস দিন');
  const used=cart.filter(c=>c.pid===p.id).reduce((a,c)=>a+c.qty,0);
  if(used+qty>p.qty)return alert('স্টকে মাত্র '+p.qty+' পিস আছে');
  cart.push({pid:p.id,name:p.name,qty,price:num($('#spr').value),cost:p.cost});R()}
function mkSale(cust,ph,p,qty,price,paid,no,ad){const s={ad:ad||'',id:uid(),no:no!=null?no:S.n++,date:today(),cust:cust||'ওয়াক-ইন কাস্টমার',ph:ph||'',pid:p.id,name:p.name,qty,price,cost:p.cost,paid};
  p.qty-=qty;S.s.push(s);return s}
function checkout(){let left=$('#paid').value===''?Infinity:num($('#paid').value),last,no=null;
  cart.forEach(c=>{const p=S.p.find(x=>x.id===c.pid);if(!p)return;if(no===null)no=S.n++;const t=c.qty*c.price,pd=Math.min(t,left);left-=pd;last=mkSale(C.n.trim(),C.ph.trim(),p,c.qty,c.price,pd,no,C.ad.trim())});
  cart=[];C={n:'',ph:'',ad:''};save();R();if(last)memo(last.id)}
function due(id){const s0=S.s.find(x=>x.id===id);if(!s0)return;const g=S.s.filter(x=>x.no===s0.no),d=g.reduce((a,x)=>a+tot(x)-x.paid,0),v=prompt('কত টাকা পেলেন? (বাকি '+d+')',d);if(v===null)return;
  let left=num(v);g.forEach(x=>{const k=Math.min(tot(x)-x.paid,left);if(k>0){x.paid+=k;left-=k}});save();R()}
function memo(id){const s=S.s.find(x=>x.id===id);if(!s)return;$('#mm').className='m';
  $('#mm').innerHTML=`<div style="text-align:center"><b style="font-size:20px">ক্যাশ মেমো</b><br>মেমো নং #${s.no} · ${s.date}</div><hr>
  <div>কাস্টমার: <b>${esc(s.cust)}</b>${s.ph?'<br>মোবাইল: '+esc(s.ph):''}</div>
  <table style="margin:10px 0;width:100%"><tr><th>পণ্য</th><th>পিস</th><th>দাম</th><th>মোট</th></tr><tr><td>${esc(s.name)}</td><td>${s.qty}</td><td>${fm(s.price)}</td><td>${fm(tot(s))}</td></tr></table>

function addOrd(e){e.preventDefault();S.o.push({id:uid(),date:today(),cust:$('#on').value.trim(),ph:$('#op').value.trim(),name:$('#oi').value.trim(),qty:num($('#oq').value),note:$('#ono').value.trim(),st:'pending'});save();R()}
function deliver(id){const o=S.o.find(x=>x.id===id),p=findP(o.name);
  if(!p)return alert('স্টকে এই পণ্য নেই। আগে ক্রয় এন্ট্রি দিন।');
  if(p.qty<o.qty)return alert('স্টকে মাত্র '+p.qty+' পিস আছে');
  const t=o.qty*p.price,v=prompt('মোট '+t+' টাকা। কত পরিশোধ করেছে?',t);if(v===null)return;
  const s=mkSale(o.cust,o.ph,p,o.qty,p.price,Math.min(t,num(v)));o.st='done';save();R();memo(s.id)}
function delOrd(id){if(confirm('অর্ডার মুছবেন?')){S.o=S.o.filter(x=>x.id!==id);save();R()}}

function delExp(id){S.e=S.e.filter(x=>x.id!==id);save();R()}

function R(){
  CL.forEach(c=>{S[c]=S[c]||[]});
  if(!M.some(m=>m[0]===tab))tab=M[0][0];const nm=M.find(m=>m[0]===tab);
  $('#sb').innerHTML=`<div class='lg'>${LOGO}<div><b>SUPER COMPUTER SHOP</b><small>ম্যানেজমেন্ট সফটওয়্যার</small></div></div>`+M.map(m=>`<button class='mi ${m[0]===tab?'on':''}' onclick="go('${m[0]}')"><span>${m[1]}</span><span class='tx'>${m[2]}</span></button>`).join('');
  $('#pt').textContent=nm[2];
  const B=[['dash','🏠','হোম'],['stock','📦','স্টক'],['sell','💳','বিক্রয়'],['cust','👥','কাস্টমার']].filter(b=>M.some(m=>m[0]===b[0]));
  $('#bn').innerHTML=B.map(b=>`<button class='${b[0]===tab?'on':''}' onclick="go('${b[0]}')"><div style='font-size:20px'>${b[1]}</div>${b[2]}</button>`).join('')+`<button onclick='tg()'><div style='font-size:20px'>☰</div>মেনু</button>`;
  $('#v').innerHTML=V[tab]();
  if(tab==='stock')rows();if(tab==='serv')svRows();if(tab==='parcel')pcRows();
}
function tg(){if(innerWidth<=820){$('#sb').classList.toggle('o');$('#ov').classList.toggle('o')}else $('#sb').classList.toggle('c')}
function go(t){tab=t;$('#sb').classList.remove('o');$('#ov').classList.remove('o');R();scrollTo(0,0)}
function cm(){$('#modal').style.display='none'}
function shw(cls,html){$('#mm').className=cls;$('#mm').innerHTML=html;$('#modal').style.display='block'}

let SF={q:'',b:'',st:''};
const stat=p=>p.qty<=0?'s':(!p.sn&&p.qty<=(cfg().low||2)?'l':'a');
const badge=p=>{const s=stat(p);return s==='s'?"<span class='bd' style='color:var(--bad)'>Sold</span>":s==='l'?"<span class='bd' style='color:var(--wn)'>Low ("+p.qty+")</span>":"<span class='bd' style='color:var(--ok)'>Available"+(p.sn?'':' ('+p.qty+')')+"</span>"};

V.stock=()=>{
  const brands=[...new Set(S.p.map(p=>p.brand).filter(Boolean))];
  return `<div class='card'><div class='f' style='margin-bottom:12px'><button class='b' onclick='pf()'>+ ল্যাপটপ যোগ করুন</button><button class='g' onclick="go('buy')">+ এক্সেসরিজ ক্রয়</button><button class='g' onclick='ps()'>🖨 স্টক প্রিন্ট</button></div>
  <div class='f'><div><label>খুঁজুন (নাম, সিরিয়াল, মডেল, ব্র্যান্ড)</label><input id='sq' value='${esc(SF.q)}' oninput='SF.q=this.value;rows()' placeholder='খুঁজুন...'></div>
  <div><label>ব্র্যান্ড</label><select onchange='SF.b=this.value;rows()'><option value=''>সব</option>${brands.map(b=>`<option ${b===SF.b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
  <div><label>অবস্থা</label><select onchange='SF.st=this.value;rows()'>${[['','সব'],['a','Available'],['s','Sold'],['l','Low Stock']].map(o=>`<option value='${o[0]}' ${o[0]===SF.st?'selected':''}>${o[1]}</option>`).join('')}</select></div></div></div>
  <div class='card'><div class='tw dt'><table><tr><th>পণ্য</th><th>ব্র্যান্ড</th><th>মডেল</th><th>সিরিয়াল</th><th>প্রসেসর</th><th>RAM</th><th>SSD</th><th>ব্যাটারি</th><th class='n'>কেনা দাম</th><th class='n'>বিক্রয় দাম</th><th>অবস্থা</th><th>অ্যাকশন</th></tr><tbody id='tb'></tbody></table></div><div class='pc' id='cards'></div><div class='mut' id='cnt' style='margin-top:8px'></div></div>`};

function rows(){
  const q=SF.q.toLowerCase();
  const L=S.p.filter(p=>(!q||[p.name,p.sn,p.model,p.brand].some(x=>String(x||'').toLowerCase().includes(q)))&&(!SF.b||p.brand===SF.b)&&(!SF.st||(SF.st==='a'?p.qty>0:stat(p)===SF.st)));
  const acts=p=>`<button class='g' onclick="pv('${p.id}')">দেখুন</button> <button class='g' onclick="pf('${p.id}')">এডিট</button> <button class='x' onclick="pd('${p.id}')">মুছুন</button>`;
  $('#tb').innerHTML=L.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.brand||'-')}</td><td>${esc(p.model||'-')}</td><td>${esc(p.sn||'-')}</td><td>${esc(p.cpu||'-')}</td><td>${esc(p.ram||'-')}</td><td>${esc(p.ssd||'-')}</td><td>${esc(p.bat||'-')}</td><td class='n'>${fm(p.cost)}</td><td class='n'>${fm(p.price)}</td><td>${badge(p)}</td><td>${acts(p)}</td></tr>`).join('')||"<tr><td colspan='12' class='mut'>কোনো পণ্য নেই।</td></tr>";
  $('#cards').innerHTML=L.map(p=>`<div class='pcard'><div style='display:flex;justify-content:space-between;gap:8px'><b>${esc(p.name)}</b>${badge(p)}</div><div class='mut'>${esc([p.brand,p.model].filter(Boolean).join(' · '))}${p.sn?'<br>S/N: '+esc(p.sn):''}</div><div class='mut'>${esc([p.cpu,p.ram,p.ssd].filter(Boolean).join(' / '))}</div><div style='margin:6px 0'>বিক্রয়: <b>${fm(p.price)}</b></div>${acts(p)}</div>`).join('')||"<div class='mut'>কোনো পণ্য নেই।</div>";
  $('#cnt').textContent=L.length+' টি পণ্য';
}

function pf(id){
  PI=null;
  const p=id?S.p.find(x=>x.id===id):{};if(!p)return;
  const F=(k,l,t,req)=>`<div><label>${l}</label><input id='f_${k}' type='${t||'text'}' value='${esc(p[k]!=null?p[k]:(k==='date'?today():''))}' ${req?'required':''}></div>`;
  shw('m dk',`<h2>${id?'ল্যাপটপ এডিট':'নতুন ল্যাপটপ'}</h2><form onsubmit="ps2(event,'${id||''}')"><div class='fg'>${F('name','পণ্যের নাম','text',1)}${F('brand','ব্র্যান্ড')}${F('model','মডেল')}${F('sn','সিরিয়াল নম্বর (একাধিক পিস হলে ফাঁকা রাখুন)','text',0)}${F('cpu','প্রসেসর')}${F('ram','RAM')}${F('ssd','SSD / HDD')}${F('disp','ডিসপ্লে')}${F('bat','ব্যাটারি ব্যাকআপ')}
  <div><label>টাচ</label><select id='f_touch'>${['Non-Touch','Touch'].map(c=>`<option ${p.touch===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label>কন্ডিশন</label><select id='f_cond'>${['Used','New','Refurbished'].map(c=>`<option ${p.cond===c?'selected':''}>${c}</option>`).join('')}</select></div>
  ${id?'':`<div><label>পিস (একই পণ্য কয়টা)</label><input id='f_qty' type='number' min='1' step='1' value='1'></div>`}${F('cost','কেনা দাম (প্রতি পিস)','number',1)}${F('price','বিক্রয় দাম','number',1)}${F('date','ক্রয়ের তারিখ','date')}${F('sup','সাপ্লায়ার')}${F('war','ওয়ারেন্টি')}${F('desc','বিবরণ')}<div><label>ছবি</label><input type='file' accept='image/*' onchange='imgPick(this)'></div></div>
  <div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:14px'><button class='b' value='s'>সেভ করুন</button>${id?'':"<button class='g' value='n'>সেভ ও আরেকটি যোগ</button>"}<button type='button' class='g' onclick='cm()'>বাতিল</button></div></form>`);
}
function ps2(e,id){
  e.preventDefault();

V.serv=()=>`<div class='card'><div class='f'><div><label>খুঁজুন (আইডি, কাস্টমার, সিরিয়াল)</label><input value='${esc(QQ.sv)}' oninput='QQ.sv=this.value;svRows()'></div><button class='b' onclick='svEdit()'>＋ নতুন সার্ভিস</button></div></div><div class='card'><div class='tw'><table><tr><th>আইডি</th><th>তারিখ</th><th>কাস্টমার</th><th>ডিভাইস</th><th>অবস্থা</th><th class='n'>মোট</th><th class='n'>বাকি</th><th></th></tr><tbody id='svl'></tbody></table></div></div>`;

}
const svf=[['cust','কাস্টমার','text',0,1],['ph','মোবাইল'],['brand','ল্যাপটপ ব্র্যান্ড'],['model','মডেল'],['sn','সিরিয়াল নম্বর'],['prob','সমস্যার বিবরণ','ta'],['acc','সাথে পাওয়া জিনিস'],['date','গ্রহণের তারিখ','date'],['tech','টেকনিশিয়ান'],['chg','সার্ভিস চার্জ (ফ্রি হলে ০)','number'],['parts','পার্টস খরচ','number'],['paid','এ পর্যন্ত পরিশোধ','number'],['st','অবস্থা','sel',SVS],['war','ওয়ারেন্টি / নোট']];
function svEdit(id){
  const v=id?S.sv.find(x=>x.id===id):{date:today(),st:'Received',chg:0,parts:0,paid:0};
  gf(id?'সার্ভিস এডিট':'নতুন সার্ভিস',svf,o=>{if(id)Object.assign(S.sv.find(x=>x.id===id),o);else S.sv.push(Object.assign({id:uid(),no:nx(S.sv)},o));save();R()},v);
}
function svSt(id,st){S.sv.find(x=>x.id===id).st=st;save()}
function svPay(id){const v=S.sv.find(x=>x.id===id),d=svt(v)-v.paid;if(d<=0)return alert('কোনো বাকি নেই');const a=prompt('কত টাকা পেলেন? (বাকি '+d+')',d);if(a===null)return;v.paid+=Math.min(d,num(a));save();R()}
function svDel(id){if(confirm('এই সার্ভিস এন্ট্রি মুছবেন?')){S.sv=S.sv.filter(x=>x.id!==id);save();R()}}
function svMemo(id){const v=S.sv.find(x=>x.id===id),c=cfg();
  shw('m a4',`<div class='inv'>${hdr('SERVICE MEMO','S-'+v.no,v.date)}<div style='margin:12px 0'>কাস্টমার: <b>${esc(v.cust)}</b> · ${esc(v.ph)}<br>ডিভাইস: ${esc([v.brand,v.model].filter(Boolean).join(' '))} ${v.sn?'· S/N: '+esc(v.sn):''}<br>সমস্যা: ${esc(v.prob)}<br>সাথে পাওয়া: ${esc(v.acc||'-')} · টেকনিশিয়ান: ${esc(v.tech||'-')}<br>অবস্থা: <b>${v.st}</b></div>
  <div style='text-align:right'>সার্ভিস চার্জ: ${fm(v.chg)}<br>পার্টস: ${fm(v.parts)}<br>মোট: <b>${fm(svt(v))}</b><br>পরিশোধ: ${fm(v.paid)}<br>বাকি: <b>${fm(svt(v)-v.paid)}</b></div>${v.war?`<div>ওয়ারেন্টি/নোট: ${esc(v.war)}</div>`:''}
  <div style='margin-top:16px;font-size:12px;white-space:pre-line'><b>শর্তাবলি:</b>\n${esc(c.terms)}</div>
  <div style='display:flex;justify-content:space-between;gap:30px;margin-top:56px;font-size:13px'><div style='flex:1;text-align:center;border-top:1px solid #000;padding-top:4px'>কাস্টমারের স্বাক্ষর<br><b>${esc(v.cust)}</b></div><div style='flex:1;text-align:center;border-top:1px solid #000;padding-top:4px'>মালিক / ম্যানেজারের স্বাক্ষর<br><b>${esc(c.owner||c.name)}</b></div></div></div>${pbar}`)}

/* Parcel & delivery */
const PCS=['Pending','Packed','Dispatched','In Transit','Delivered','Cancelled'];
V.parcel=()=>`<div class='card'><div class='f'><div><label>খুঁজুন (আইডি, কাস্টমার, ট্র্যাকিং)</label><input value='${esc(QQ.pc)}' oninput='QQ.pc=this.value;pcRows()'></div><button class='b' onclick='pcEdit()'>＋ নতুন পার্সেল</button></div></div><div class='card'><div class='tw'><table><tr><th>আইডি</th><th>তারিখ</th><th>কাস্টমার</th><th>পণ্য</th><th>কুরিয়ার</th><th>অবস্থা</th><th class='n'>চার্জ</th><th></th></tr><tbody id='pcl'></tbody></table></div></div>`;
function pcRows(){
  const q=QQ.pc.toLowerCase();

  $('#pcl').innerHTML=L.map(v=>`<tr><td>P-${v.no}</td><td>${v.date}</td><td>${esc(v.cust)}<br><span class='mut'>${esc(v.ph)}</span></td><td>${esc(v.prod)}<br><span class='mut'>${esc(v.sn)}</span></td><td>${esc(v.courier)}<br><span class='mut'>${esc(v.track)}</span></td><td><select onchange="pcSt('${v.id}',this.value)">${PCS.map(x=>`<option ${x===v.st?'selected':''}>${x}</option>`).join('')}</select></td><td class='n'>${fm((v.pch||0)+(v.dch||0))}</td><td><button class='ic ed' onclick="pcEdit('${v.id}')">✏️</button> <button class='ic' onclick="pcSlip('${v.id}')">🖨</button> <button class='ic rd' onclick="pcDel('${v.id}')">🗑</button></td></tr>`).join('')||"<tr><td colspan='8' class='mut'>কোনো পার্সেল নেই।</td></tr>";

const pcf=[['cust','কাস্টমার','text',0,1],['ph','মোবাইল'],['addr','ঠিকানা'],['prod','পণ্য'],['sn','সিরিয়াল'],['courier','কুরিয়ার'],['track','ট্র্যাকিং নম্বর'],['date','ডিসপ্যাচ তারিখ','date'],['ddate','ডেলিভারি তারিখ','date'],['pch','পার্সেল চার্জ','number'],['dch','ডেলিভারি চার্জ','number'],['st','অবস্থা','sel',PCS]];

  gf(id?'পার্সেল এডিট':'নতুন পার্সেল',pcf,o=>{if(id)Object.assign(S.pc.find(x=>x.id===id),o);else S.pc.push(Object.assign({id:uid(),no:nx(S.pc)},o));save();R()},v)}
function pcSt(id,st){S.pc.find(x=>x.id===id).st=st;save()}
function pcDel(id){if(confirm('এই পার্সেল মুছবেন?')){S.pc=S.pc.filter(x=>x.id!==id);save();R()}}
function pcSlip(id){const v=S.pc.find(x=>x.id===id);
  shw('m a4',`<div class='inv'>${hdr('PARCEL SLIP','P-'+v.no,v.date)}<div style='margin:12px 0;font-size:16px'><b>প্রাপক:</b> ${esc(v.cust)}<br>মোবাইল: ${esc(v.ph)}<br>ঠিকানা: ${esc(v.addr)}<br><br>পণ্য: ${esc(v.prod)} ${v.sn?'(S/N '+esc(v.sn)+')':''}<br>কুরিয়ার: ${esc(v.courier)} · ট্র্যাকিং: ${esc(v.track)}<br>অবস্থা: ${v.st}</div></div>${pbar}`)}

/* Company / supplier accounts */
const cob=c=>{const k=c.name.trim().toLowerCase(),pu=S.pu.filter(b=>(b.sup||'').trim().toLowerCase()===k),tp=pu.reduce((a,b)=>a+b.qty*b.cost,0),pp=pu.reduce((a,b)=>a+pdv(b),0),pays=S.cp.filter(x=>x.co===c.id),pa=pays.reduce((a,x)=>a+x.amt,0);return{pu,tp,pays,paid:pp+pa,due:tp-pp-pa}};
V.comp=()=>`<div class='card'><button class='b' onclick='coEdit()'>＋ নতুন কোম্পানি / সাপ্লায়ার</button><p class='mut'>ক্রয়ের সময় সাপ্লায়ারের নাম কোম্পানির নামের সাথে মিললে হিসাব নিজে থেকে এখানে আসে।</p></div><div class='card'>${S.co.map(c=>{const o=cob(c);return `<details><summary>${esc(c.name)} — মোট ক্রয় ${fm(o.tp)}, পরিশোধ ${fm(o.paid)}, <span class='${o.due>0?'bad':''}'>বাকি ${fm(o.due)}</span></summary><div class='mut'>${esc([c.contact,c.ph,c.addr].filter(Boolean).join(' · '))}</div><div style='margin:8px 0;display:flex;gap:8px;flex-wrap:wrap'><button class='g' onclick="coPay('${c.id}')">পেমেন্ট দিন</button><button class='g' onclick="coEdit('${c.id}')">এডিট</button><button class='x' onclick="coDel('${c.id}')">মুছুন</button></div><div class='tw'><table>${o.pu.map(b=>`<tr><td>${b.date}</td><td>ক্রয়: ${esc(b.name)} × ${b.qty}</td><td class='n'>${fm(b.qty*b.cost)}</td></tr>`).join('')}${o.pays.map(x=>`<tr><td>${x.date}</td><td>পেমেন্ট দেওয়া</td><td class='n ok'>−${fm(x.amt)}</td></tr>`).join('')}</table></div></details>`}).join('')||"<span class='mut'>কোনো কোম্পানি নেই।</span>"}</div>`;
function coEdit(id){const v=id?S.co.find(x=>x.id===id):{};
  gf(id?'কোম্পানি এডিট':'নতুন কোম্পানি',[['name','কোম্পানির নাম','text',0,1],['contact','যোগাযোগ ব্যক্তি'],['ph','মোবাইল'],['addr','ঠিকানা'],['dd','বাকি পরিশোধের তারিখ','date']],o=>{if(id)Object.assign(S.co.find(x=>x.id===id),o);else S.co.push(Object.assign({id:uid()},o));save();R()},v)}
function coPay(id){const c=S.co.find(x=>x.id===id),d=cob(c).due;if(d<=0)return alert('কোনো বাকি নেই');const a=prompt('কত টাকা দিলেন? (বাকি '+d+')',d);if(a===null)return;const n=Math.min(d,num(a));if(n>0){S.cp.push({id:uid(),date:today(),co:id,amt:n});save();R()}}
function coDel(id){if(S.cp.some(x=>x.co===id))return alert('এই কোম্পানির পেমেন্ট রেকর্ড আছে, মোছা যাবে না।');if(confirm('কোম্পানি মুছবেন?')){S.co=S.co.filter(x=>x.id!==id);save();R()}}

/* Reports */
V.rep=()=>{
  const ok=d=>(!RP.f||d>=RP.f)&&(!RP.t||d<=RP.t);
  const s=S.s.filter(x=>ok(x.date)),pu=S.pu.filter(x=>ok(x.date)),sv=S.sv.filter(x=>ok(x.date));
  const sal=s.reduce((a,x)=>a+tot(x),0),rec=s.reduce((a,x)=>a+x.paid,0),cogs=s.reduce((a,x)=>a+x.qty*x.cost,0),pur=pu.reduce((a,x)=>a+x.qty*x.cost,0);
  const ex=S.e.filter(x=>ok(x.date)).reduce((a,x)=>a+x.amt,0),svi=sv.reduce((a,x)=>a+x.paid,0),svp=sv.reduce((a,x)=>a+x.parts,0),net=sal-cogs+svi-svp-ex;
  const T3=[['t1','মোট বিক্রি',sal],['t2','বিক্রয় লাভ',sal-cogs],['t4','ক্রয়',pur],['t1','সার্ভিস আয়',svi],['t3','অন্যান্য খরচ',ex],['t2','নিট লাভ',net],['t3','কাস্টমারের বাকি',sal-rec],['t4','কোম্পানির বাকি',S.co.reduce((a,c)=>a+Math.max(0,cob(c).due),0)]];
  return `<div class='card'><div class='f'><div><label>শুরুর তারিখ</label><input type='date' value='${RP.f}' onchange='RP.f=this.value;R()'></div><div><label>শেষ তারিখ</label><input type='date' value='${RP.t}' onchange='RP.t=this.value;R()'></div><button class='g' onclick="RP={f:'',t:''};R()">সব সময়</button><button class='b' onclick='rpx()'>⬇ বিক্রয় রিপোর্ট (Excel)</button></div></div>
  <div class='grid tl'>${T3.map(t=>`<div class='tile ${t[0]}'><small>${t[1]}</small><b>${fm(t[2])}</b></div>`).join('')}</div>
  <div class='card'><h2>বিক্রিত পণ্য</h2><div class='tw'><table><tr><th>মেমো</th><th>তারিখ</th><th>কাস্টমার</th><th>পণ্য</th><th class='n'>মোট</th><th class='n'>বাকি</th><th></th></tr>${memoRows(s.slice().reverse())}</table></div></div>
  <div class='card'><h2>বর্তমান স্টকের মূল্য: ${fm(S.p.reduce((a,p)=>a+Math.max(0,p.qty)*p.cost,0))}</h2><p class='mut'>লাভ = বিক্রয় − কেনা দাম। নিট লাভ = বিক্রয় লাভ + সার্ভিস আয় − সার্ভিসের পার্টস − অন্যান্য খরচ।</p></div>`;
};
function rpx(){const ok=d=>(!RP.f||d>=RP.f)&&(!RP.t||d<=RP.t);dls('sales-report.csv',csv([['Memo','Date','Customer','Phone','Product','Qty','Price','Total','Paid','Due']].concat(S.s.filter(x=>ok(x.date)).map(x=>[x.no,x.date,x.cust,x.ph,x.name,x.qty,x.price,tot(x),x.paid,tot(x)-x.paid]))))}

/* Settings, backup, restore */
V.set=()=>{const c=cfg();return `<div class='card'><h2>দোকানের তথ্য ও ইনভয়েসের শর্ত</h2><p class='mut'>${esc(c.name)} · ${esc(c.owner)} · ${esc(c.ph)}<br>${esc(c.addr)}</p><button class='b' onclick='setEdit()'>এডিট করুন</button></div><div class='card'><h2>ব্যাকআপ ও রিস্টোর</h2><div class='f'><button class='b' onclick="bkNow()">⬇ ব্যাকআপ ডাউনলোড</button><div><label>ব্যাকআপ ফাইল থেকে রিস্টোর</label><input type='file' accept='.json' onchange='rs(this)'></div></div></div>`};
function setEdit(){gf('সেটিংস',[['name','দোকানের নাম','text',0,1],['owner','মালিক'],['ph','ফোন / WhatsApp'],['addr','ঠিকানা'],['low','কম স্টকের সীমা (পিস)','number'],['terms','ইনভয়েসের শর্তাবলি','ta']],o=>{const m=S.cf.find(x=>x.id==='main');if(m)Object.assign(m,o);else S.cf.push(Object.assign({id:'main'},o));save();R()},cfg())}
function rs(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.p||!o.s)throw 0;if(!confirm('বর্তমান সব ডেটা বদলে এই ব্যাকআপ বসবে। নিশ্চিত?'))return;S=o;CL.forEach(c=>{S[c]=S[c]||[]});S.n=S.n||nx(S.s);save();R()}catch(e){alert('ব্যাকআপ ফাইলটি ঠিক নেই')}};r.readAsText(f)}
/* ===== Delete & cleanup ===== */
let CUL=[];
function delSale(id){
  const s=S.s.find(x=>x.id===id);if(!s)return;
  const g=S.s.filter(x=>x.no===s.no);
  if(!confirm('মেমো #'+s.no+' ('+s.cust+' — '+g.map(x=>x.name+' × '+x.qty).join(', ')+') মুছবেন?'))return;
  if(confirm('পণ্যগুলো ('+g.reduce((a,x)=>a+x.qty,0)+' পিস) স্টকে ফেরত যোগ করবেন?\nOK = ফেরত যোগ হবে (ভুল মেমো হলে)\nCancel = ফেরত যোগ হবে না'))g.forEach(x=>{const p=S.p.find(y=>y.id===x.pid);if(p)p.qty+=x.qty});
  const ids=new Set(g.map(x=>x.id));S.s=S.s.filter(x=>!ids.has(x.id));save();R();
}
function delCust(i){
  const c=CUL[i];if(!c)return;
  if(!confirm('"'+(c.n||'নাম নেই')+'" এর '+c.l.length+'টা মেমো মুছবেন?'))return;
  const back=confirm('এই মেমোগুলোর পণ্য স্টকে ফেরত যোগ করবেন?\nOK = ফেরত যোগ হবে\nCancel = ফেরত যোগ হবে না');
  if(back)c.l.forEach(s=>{const p=S.p.find(x=>x.id===s.pid);if(p)p.qty+=s.qty});
  const ids=new Set(c.l.map(s=>s.id));S.s=S.s.filter(x=>!ids.has(x.id));save();R();
}
function pd(id){
  const p=S.p.find(x=>x.id===id);if(!p)return;
  const n=S.s.filter(s=>s.pid===id).length;
  if(n){if(!confirm('"'+p.name+'" এর '+n+'টা বিক্রয় মেমো আছে। পণ্য, ক্রয় এন্ট্রি আর এই মেমোগুলো সব মুছবেন?'))return;S.s=S.s.filter(s=>s.pid!==id)}
  else if(!confirm('"'+p.name+'" মুছবেন? এর ক্রয় এন্ট্রিও মুছে যাবে।'))return;
  S.p=S.p.filter(x=>x.id!==id);S.pu=S.pu.filter(x=>x.pid!==id);save();R();
}
function clearOld(){

    const jobs=[];

    Object.keys(csnap).forEach(id=>{if(!want[id]){delete csnap[id];jobs.push(DB.collection('catalog').doc(id).delete())}});
